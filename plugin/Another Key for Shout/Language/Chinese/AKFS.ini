[Settings]
; AKFS (Another Key for Shout) 配置 — 简体中文 / English 由安装时选择的语言文件决定
KeyCode=45 ; X
PowerOncePerDay=1 ; 特殊能力是否"一天一次"(0=关闭, 只走 3s 短冷却)
DailyBypass= ; 豁免"当日一次"的 formID 列表, 逗号分隔 8 位 hex
BlockedPowers= ; 变身形能力黑名单 formID 列表(逗号分隔 8 位 hex)。存槽/施放一律拦截。
               ; 吸血鬼领主/狼人变身等变身 power 默认已按 effect archetype 自动排除，
               ; 此项仅供额外排除其它不想走 X 键的能力。

[Lang]
Language=中文

; ============================================================
; 以下是 SKSE Menu Framework 菜单的界面文本，一般无需修改。
; 如需翻译成其它语言，复制本文件并翻译 [Strings] 节即可。
; ============================================================
[Strings]
SectionName=Another Key for Shout
PageSettings=设置
PageStatus=状态

; ---- 设置页 ----
LabelTriggerKey=触发键
LabelTriggerKeyHint=用于施放第二槽的按键。点击 Capture 后按任意键即可重新绑定。
LabelPowerOncePerDay=特殊能力每日一次
LabelPowerOncePerDayHint=仅对"大能力"(kPower)生效。关闭后只受 3 秒短冷却限制。
LabelDailyBypass=豁免每日一次
LabelDailyBypassHint=列表中的大能力不受"每日一次"限制，可反复使用(如净化后的野兽形态)。
LabelBlockedPowers=禁止存入第二槽
LabelBlockedPowersHint=列表中的能力无法存入第二槽、也不会被 X 键施放。变身类能力已自动拦截。
LabelLanguage=界面语言
LabelLanguageHint=切换后立即生效，同时决定 ini 中提示文案的语言。
BtnAdd=添加
BtnRemove=删除
BtnReloadIni=重新加载 ini
TxtEmptyList=(列表为空)
TxtNoSelection=(请先选中一项)

; ---- 状态页 ----
LabelSecondSlot=第二槽
LabelZSlot=Z 槽龙吼
LabelSlotType=类型
LabelShoutCooldown=龙吼冷却
LabelPowerCooldown=能力冷却
LabelVoiceState=voiceState
LabelIniPath=配置文件
BtnClearSlot=清空第二槽
BtnTestCast=测试施放
TxtNotSet=(未设置)
TxtReady=就绪
TxtShoutType=龙吼
TxtPowerType=能力
TxtInvalidFormId=无效的 formID(需 8 位十六进制)
