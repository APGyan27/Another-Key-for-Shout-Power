[Settings]
; AKFS (Another Key for Shout) config — English / 简体中文 by the language file you install
KeyCode=45 ; X
PowerOncePerDay=1 ; Whether powers are "once per day" (0=off, only 3s short cooldown)
DailyBypass= ; Comma-separated 8-digit hex formIDs exempt from "once per day"
BlockedPowers= ; Comma-separated 8-digit hex formIDs to block from the X second slot (store & cast).
               ; Vampire Lord / werewolf transformation powers are excluded automatically by effect
               ; archetype; add here only to block other powers you do not want fired on X.

[Lang]
Language=English

; ============================================================
; UI text for the SKSE Menu Framework page. Normally no need to edit.
; To add another language, copy this file and translate the [Strings] section.
; ============================================================
[Strings]
SectionName=Another Key for Shout
PageSettings=Settings
PageStatus=Status

; ---- Settings page ----
LabelTriggerKey=Trigger key
LabelTriggerKeyHint=Key used to fire the second slot. Click Capture and press any key to rebind.
LabelPowerOncePerDay=Powers once per game day
LabelPowerOncePerDayHint=Applies to Greater Powers only. When off, only the 3s short cooldown remains.
LabelDailyBypass=Once-per-day exemptions
LabelDailyBypassHint=Greater Powers listed here ignore the once-per-day gate and can be used repeatedly.
LabelBlockedPowers=Blocked from second slot
LabelBlockedPowersHint=Powers listed here cannot be stored in the second slot or fired with the key. Transformation powers are always blocked.
LabelLanguage=UI language
LabelLanguageHint=Applies immediately, and also selects which language the ini messages use.
BtnAdd=Add
BtnRemove=Remove
BtnReloadIni=Reload ini
TxtEmptyList=(list is empty)
TxtNoSelection=(select an item first)

; ---- Status page ----
LabelSecondSlot=Second slot
LabelZSlot=Z shout slot
LabelSlotType=Type
LabelShoutCooldown=Shout cooldown
LabelPowerCooldown=Power cooldown
LabelVoiceState=voiceState
LabelIniPath=Config file
BtnClearSlot=Clear second slot
BtnTestCast=Test cast
TxtNotSet=(not set)
TxtReady=Ready
TxtShoutType=Shout
TxtPowerType=Power
TxtInvalidFormId=Invalid formID (8-digit hex required)
